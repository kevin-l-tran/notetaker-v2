name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.24.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true
          install: true

      - name: Run Biome checks
        run: pnpm check:ci

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm exec vitest run

      - name: Build production packages
        run: pnpm build